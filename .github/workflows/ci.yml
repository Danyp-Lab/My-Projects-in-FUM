name: Documentation & Quality CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  markdown-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint Markdown Files
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: '**/*.md'
